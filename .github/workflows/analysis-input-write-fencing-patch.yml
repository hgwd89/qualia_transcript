name: Analysis Input Write Fencing Patch

on:
  push:
    branches:
      - fix/analysis-input-write-fencing

permissions:
  contents: write

jobs:
  patch-analysis-input-write-fencing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/analysis-input-write-fencing
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply and validate input-write fencing patch
        shell: bash
        run: |
          python scripts/patch_analysis_input_write_fencing.py
          python -m py_compile services/research_input_guard.py routes/interviews.py tests/smoke_processing_input_fencing.py
          python tests/smoke_processing_input_fencing.py
          python tests/smoke_processing_jobs.py
          python tests/smoke_role_normalization.py
          python tests/smoke_secondary_analysis_jobs.py
          git checkout -- .github/workflows/processing-jobs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add routes/interviews.py
          git commit -m 'fix: fence mutable analysis inputs against active jobs'
          git push origin HEAD:fix/analysis-input-write-fencing
