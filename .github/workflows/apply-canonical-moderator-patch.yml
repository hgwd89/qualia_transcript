name: Apply Canonical Moderator Patch

on:
  push:
    branches:
      - fix/canonical-moderator-auto-role

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canonical-moderator-auto-role
          fetch-depth: 0
      - name: Patch auto speaker role canonical value
        shell: python
        run: |
          from pathlib import Path
          p = Path("services/transcription.py")
          text = p.read_text(encoding="utf-8")
          replacements = [
              (
                  "    - 2話者以上: 発話語数が最も少ない話者 = interviewer、それ以外 = respondent\n",
                  "    - 2話者以上: 発話語数が最も少ない話者 = moderator、それ以外 = respondent\n",
              ),
              (
                  "        interviewer_label = min(word_counts, key=word_counts.get)\n",
                  "        moderator_label = min(word_counts, key=word_counts.get)\n",
              ),
              (
                  '            seg.speaker_role = "interviewer" if label == interviewer_label else "respondent"\n',
                  '            seg.speaker_role = "moderator" if label == moderator_label else "respondent"\n',
              ),
          ]
          changed = False
          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match, found {text.count(old)}: {old}")
              text = text.replace(old, new, 1)
              changed = True
          if changed:
              p.write_text(text, encoding="utf-8")
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/transcription.py
          git commit -m "fix: store canonical moderator role in auto assignment"
          git push origin HEAD:fix/canonical-moderator-auto-role
