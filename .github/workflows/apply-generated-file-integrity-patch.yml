name: Apply Generated File Integrity Patch

on:
  push:
    branches:
      - fix/generated-file-integrity

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generated-file-integrity
          fetch-depth: 0
      - name: Apply generated-file integrity source patch
        run: python scripts/apply_generated_file_integrity_patch.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/report_verbatim.py services/report_formatted.py services/report_analysis.py services/report_approved_analysis.py routes/outputs.py
          git commit -m "fix: keep generated files aligned with DB metadata"
          git push origin HEAD:fix/generated-file-integrity
