name: Apply Interview Job UI Patch

on:
  push:
    branches:
      - fix/analysis-job-queue

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/analysis-job-queue
          fetch-depth: 0
      - name: Patch durable job UI polling
        run: python scripts/apply_interview_job_ui_patch.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/interviews/detail.html
          git commit -m "fix: wait for durable interview jobs in UI"
          git push origin HEAD:fix/analysis-job-queue
