name: Apply Media Upload Integrity Patch

on:
  push:
    branches:
      - fix/media-upload-integrity

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/media-upload-integrity
          fetch-depth: 0
      - name: Apply media upload integrity patch
        run: python scripts/apply_media_upload_integrity_patch.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/interviews.py services/transcription.py
          git commit -m "fix: keep uploaded media aligned with DB metadata"
          git push origin HEAD:fix/media-upload-integrity
