name: Apply Project Deletion Cleanup Patch

on:
  push:
    branches:
      - fix/project-deletion-lifecycle

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-deletion-lifecycle
          fetch-depth: 0
      - name: Apply project deletion cleanup patch
        run: python scripts/apply_project_deletion_cleanup_patch.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/project_deletion.py
          git commit -m "fix: keep post-delete storage cleanup best effort"
          git push origin HEAD:fix/project-deletion-lifecycle
