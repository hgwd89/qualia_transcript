name: Apply Readiness Secret Patch

on:
  push:
    branches:
      - fix/readiness-secret-storage

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readiness-secret-storage
          fetch-depth: 0
      - name: Apply readiness secret patch
        run: python scripts/apply_readiness_secret_patch.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit_production_readiness_v2.py
          git commit -m "fix: block unsafe secret storage in readiness audit"
          git push origin HEAD:fix/readiness-secret-storage
