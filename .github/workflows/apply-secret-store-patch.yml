name: Apply Secret Store Patch

on:
  push:
    branches:
      - fix/dpapi-secret-storage

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dpapi-secret-storage
          fetch-depth: 0
      - name: Apply secret-store integration patch
        run: python scripts/apply_secret_store_patch.py
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py services/transcription.py services/product_hint.py
          git commit -m "fix: route API credentials through DPAPI secret store"
          git push origin HEAD:fix/dpapi-secret-storage
