name: Apply Transcription Test Patch

on:
  push:
    branches:
      - fix/transcription-final-write

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transcription-final-write
          fetch-depth: 0
      - name: Patch test helper
        shell: python
        run: |
          from pathlib import Path
          p = Path("tests/smoke_transcription_final_write_fencing.py")
          text = p.read_text(encoding="utf-8")
          old = "lambda _src, _out, _start, duration_sec: float(duration_sec)"
          new = "lambda src_path, out_path, start_sec, duration_sec: float(duration_sec)"
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f"expected one helper lambda, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/smoke_transcription_final_write_fencing.py
          git commit -m "test: accept keyword chunk export arguments"
          git push origin HEAD:fix/transcription-final-write
