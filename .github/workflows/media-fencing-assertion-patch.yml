name: Media Fencing Assertion Patch

on:
  push:
    branches:
      - fix/transcription-state-result-write-fence

permissions:
  contents: write

jobs:
  patch-media-fencing-assertion:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/transcription-state-result-write-fence
          fetch-depth: 2

      - name: Update legacy source assertion
        shell: bash
        run: |
          python scripts/patch_media_upload_fencing_assertion.py
          git rm scripts/patch_media_upload_fencing_assertion.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/smoke_media_upload_integrity.py
          git commit -m 'test: align media fencing assertion with result-write guard'
          git push origin HEAD:fix/transcription-state-result-write-fence
