name: Ordinary Artifact Provenance

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordinary-artifact-provenance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      RAKUTEN_APP_ID: ""
      GOOGLE_BOOKS_API_KEY: ""
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ordinary artifact provenance regression
        run: python tests/smoke_ordinary_artifact_provenance.py

      - name: Run ordinary artifact provenance downgrade regression
        run: python tests/smoke_ordinary_artifact_provenance_downgrade.py
