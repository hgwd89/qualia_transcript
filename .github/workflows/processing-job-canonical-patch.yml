name: Processing Job Canonical Gate Patch

on:
  push:
    branches:
      - fix/processing-job-canonical-gate

permissions:
  contents: write

jobs:
  patch-processing-job-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/processing-job-canonical-gate
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply and validate canonical job gate patch
        shell: bash
        run: |
          python scripts/patch_processing_job_canonical_gate.py
          python scripts/patch_secondary_retry_generation.py
          python -m py_compile services/processing_jobs.py tests/smoke_processing_jobs.py tests/smoke_secondary_analysis_jobs.py
          python tests/smoke_processing_jobs.py
          python tests/smoke_role_normalization.py
          python tests/smoke_interview_job_ui.py
          python tests/smoke_secondary_analysis_jobs.py
          git rm scripts/patch_processing_job_canonical_gate.py scripts/patch_secondary_retry_generation.py .github/workflows/processing-job-canonical-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/processing_jobs.py tests/smoke_processing_jobs.py tests/smoke_secondary_analysis_jobs.py .github/workflows/processing-jobs.yml
          git commit -m 'fix: route legacy processing jobs through canonical admission'
          git push origin HEAD:fix/processing-job-canonical-gate
