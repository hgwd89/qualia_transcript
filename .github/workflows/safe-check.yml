name: Raw Snapshot Durability Patch

on:
  push:
    branches:
      - fix/raw-snapshot-crash-durability

permissions:
  contents: write

jobs:
  patch-raw-snapshot-durability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/raw-snapshot-crash-durability
          fetch-depth: 2

      - name: Apply production patch once
        shell: bash
        run: |
          if [ ! -f scripts/patch_raw_snapshot_durability.py ]; then
            echo "patch already applied"
            exit 0
          fi
          python scripts/patch_raw_snapshot_durability.py
          git rm scripts/patch_raw_snapshot_durability.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/storage_paths.py services/raw_snapshot_storage.py tests/smoke_raw_snapshot_storage_fencing.py
          git commit -m 'fix: make raw evidence creation crash-durable'
          git push origin HEAD:fix/raw-snapshot-crash-durability
