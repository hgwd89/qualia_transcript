name: Safe Smoke Check

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-smoke:
    name: safe-smoke
    runs-on: windows-latest
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      RAKUTEN_APP_ID: ""
      GOOGLE_BOOKS_API_KEY: ""
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run safe smoke check
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/check_safe.ps1

      - name: Run generated-file registration boundary regression
        run: python tests/smoke_generated_file_registration_boundary.py

      - name: Run approved-artifact currentness regression
        run: python tests/smoke_approved_artifact_currentness.py

      - name: Run readiness formal-artifact currentness parity regression
        run: python tests/smoke_approved_artifact_readiness_currentness.py

      - name: Run ordinary generated-file readiness byte-integrity regression
        run: python tests/smoke_generated_file_readiness_integrity.py

      - name: Run OOXML readiness package validation regression
        run: python tests/smoke_ooxml_readiness_validation.py

      - name: Run readiness single-artifact snapshot regression
        run: python tests/smoke_readiness_artifact_snapshot_consistency.py

      - name: Run source-media readiness integrity regression
        run: python tests/smoke_media_readiness_integrity.py

      - name: Run latest-backup ordering regression
        run: python tests/smoke_latest_backup_ordering.py

      - name: Run readiness single-database-snapshot regression
        run: python tests/smoke_readiness_db_snapshot.py

      - name: Run production transcription dispatch fencing regression
        run: python tests/smoke_transcription_dispatch_fencing.py

      - name: Run managed write identity regression
        run: python tests/smoke_managed_write_identity.py

      - name: Run managed write commit-window regression
        run: python tests/smoke_managed_write_commit_window.py

      - name: Run raw snapshot storage fencing regression
        run: python tests/smoke_raw_snapshot_storage_fencing.py

      - name: Run question-code readiness regression
        run: python tests/smoke_question_code_readiness.py

      - name: Run analysis flow provenance regression
        run: python tests/smoke_analysis_flow_provenance.py

  posix-backup-snapshot:
    name: posix-backup-snapshot
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      RAKUTEN_APP_ID: ""
      GOOGLE_BOOKS_API_KEY: ""
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run generated-file registration boundary regression
        run: python tests/smoke_generated_file_registration_boundary.py

      - name: Run approved-artifact currentness regression
        run: python tests/smoke_approved_artifact_currentness.py

      - name: Run readiness formal-artifact currentness parity regression
        run: python tests/smoke_approved_artifact_readiness_currentness.py

      - name: Run ordinary generated-file readiness byte-integrity regression
        run: python tests/smoke_generated_file_readiness_integrity.py

      - name: Run OOXML readiness package validation regression
        run: python tests/smoke_ooxml_readiness_validation.py

      - name: Run readiness single-artifact snapshot regression
        run: python tests/smoke_readiness_artifact_snapshot_consistency.py

      - name: Run source-media readiness integrity regression
        run: python tests/smoke_media_readiness_integrity.py

      - name: Run latest-backup ordering regression
        run: python tests/smoke_latest_backup_ordering.py

      - name: Run readiness single-database-snapshot regression
        run: python tests/smoke_readiness_db_snapshot.py

      - name: Run POSIX snapshot fencing regression
        run: python tests/smoke_backup_snapshot_fencing.py

      - name: Run POSIX managed-storage read/write fencing regression
        run: python tests/smoke_linked_storage_guards.py

      - name: Run managed write identity regression
        run: python tests/smoke_managed_write_identity.py

      - name: Run managed write commit-window regression
        run: python tests/smoke_managed_write_commit_window.py

      - name: Run raw snapshot storage fencing regression
        run: python tests/smoke_raw_snapshot_storage_fencing.py

      - name: Run OpenAI chunk result-write fencing regression
        run: python tests/smoke_openai_chunk_write_fencing.py

      - name: Run question identity/evidence-scope regression
        run: python tests/smoke_question_code_identity.py

      - name: Run question-code readiness regression
        run: python tests/smoke_question_code_readiness.py

      - name: Run project flow scope regression
        run: python tests/smoke_project_flow_scope.py

      - name: Run analysis flow provenance regression
        run: python tests/smoke_analysis_flow_provenance.py
