name: Safe Smoke Check

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-master:
    name: sync-master
    runs-on: ubuntu-latest
    if: github.head_ref == 'fix/media-transcription-read-fencing'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/media-transcription-read-fencing
          fetch-depth: 0

      - name: Merge current master if needed
        shell: bash
        run: |
          git fetch origin master
          if git merge-base --is-ancestor origin/master HEAD; then
            echo 'Current master already included.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-edit origin/master
            git push origin HEAD:fix/media-transcription-read-fencing
          fi

  safe-smoke:
    name: safe-smoke
    runs-on: windows-latest
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      RAKUTEN_APP_ID: ""
      GOOGLE_BOOKS_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run safe smoke check
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/check_safe.ps1

  posix-backup-snapshot:
    name: posix-backup-snapshot
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      RAKUTEN_APP_ID: ""
      GOOGLE_BOOKS_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run POSIX snapshot fencing regression
        run: python tests/smoke_backup_snapshot_fencing.py

      - name: Run POSIX managed-storage read fencing regression
        run: python tests/smoke_linked_storage_guards.py
