name: Safe Smoke Check

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-smoke:
    name: safe-smoke
    runs-on: windows-latest
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      RAKUTEN_APP_ID: ""
      GOOGLE_BOOKS_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run safe smoke check
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/check_safe.ps1

      - name: Run processing job regression smoke check
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/check_processing_jobs.ps1

      - name: Run job fencing smoke check
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/check_job_fencing.ps1

      - name: Run result idempotency smoke check
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/check_processing_result_idempotency.ps1

      - name: Run result write fencing smoke check
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/check_result_write_fencing.ps1

      - name: Run mapping retry idempotency smoke check
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/check_mapping_retry_idempotency.ps1

      - name: Run project pipeline resilience smoke check
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/check_project_pipeline_resilience.ps1
