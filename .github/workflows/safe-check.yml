name: Safe Smoke Check

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-managed-write-docs:
    name: patch-managed-write-docs
    runs-on: ubuntu-latest
    if: github.head_ref == 'fix/managed-write-fencing'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/managed-write-fencing
          fetch-depth: 0

      - name: Patch docs once
        shell: bash
        run: |
          python scripts/patch_managed_write_docs.py
          if git diff --quiet -- docs/architecture.md docs/testing.md; then
            echo 'Managed-write docs already synchronized.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/architecture.md docs/testing.md
            git commit -m 'docs: document ancestry-pinned managed writes'
            git push origin HEAD:fix/managed-write-fencing
          fi

  safe-smoke:
    name: safe-smoke
    runs-on: windows-latest
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      RAKUTEN_APP_ID: ""
      GOOGLE_BOOKS_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run safe smoke check
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/check_safe.ps1

      - name: Run managed write identity regression
        run: python tests/smoke_managed_write_identity.py

  posix-backup-snapshot:
    name: posix-backup-snapshot
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      RAKUTEN_APP_ID: ""
      GOOGLE_BOOKS_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run POSIX snapshot fencing regression
        run: python tests/smoke_backup_snapshot_fencing.py

      - name: Run POSIX managed-storage read/write fencing regression
        run: python tests/smoke_linked_storage_guards.py

      - name: Run managed write identity regression
        run: python tests/smoke_managed_write_identity.py
