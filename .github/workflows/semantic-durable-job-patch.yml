name: Semantic Durable Job Patch

on:
  push:
    branches:
      - fix/semantic-analysis-durable-job

permissions:
  contents: write

jobs:
  patch-semantic-durable-job:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/semantic-analysis-durable-job
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply and validate semantic durable job patch
        shell: bash
        run: |
          python scripts/patch_semantic_durable_job.py
          python -m py_compile services/job_admission.py services/processing_jobs.py services/processing_result_guard.py services/semantic_analysis.py scripts/run_semantic_analysis.py tests/smoke_semantic_analysis_job_fencing.py
          python tests/smoke_semantic_analysis_job_fencing.py
          python tests/smoke_processing_jobs.py
          python tests/smoke_processing_input_fencing.py
          python tests/smoke_secondary_analysis_jobs.py
          git rm scripts/patch_semantic_durable_job.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/job_admission.py services/processing_jobs.py services/processing_result_guard.py services/semantic_analysis.py scripts/run_semantic_analysis.py tests/smoke_semantic_analysis_job_fencing.py
          git commit -m 'fix: run semantic analysis saves through durable jobs'
          git push origin HEAD:fix/semantic-analysis-durable-job
