name: Transcription Chunk Error Rollback Patch

on:
  push:
    branches:
      - fix/transcription-state-result-write-fence

permissions:
  contents: write

jobs:
  patch-chunk-error-rollback:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/transcription-state-result-write-fence
          fetch-depth: 2

      - name: Apply rollback hardening
        shell: bash
        run: |
          python scripts/patch_transcription_chunk_error_rollback.py
          git rm scripts/patch_transcription_chunk_error_rollback.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/transcription.py tests/smoke_transcription_state_fencing.py
          git commit -m 'fix: rollback failed chunk before error-manifest fence'
          git push origin HEAD:fix/transcription-state-result-write-fence
