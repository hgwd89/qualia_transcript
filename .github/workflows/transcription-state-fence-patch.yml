name: Transcription State Fence Patch

on:
  push:
    branches:
      - fix/transcription-state-result-write-fence

permissions:
  contents: write

jobs:
  patch-transcription-state-fence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/transcription-state-result-write-fence
          fetch-depth: 2

      - name: Apply production patch once
        shell: bash
        run: |
          python scripts/run_patch_transcription_state_fencing_v2.py
          git rm scripts/patch_transcription_state_fencing.py scripts/run_patch_transcription_state_fencing_v2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/processing_jobs.py services/transcription.py scripts/check_safe.ps1 docs/transcription-dispatch-fencing.md docs/architecture.md docs/testing.md
          git commit -m 'fix: fence transcription lifecycle writes'
          git push origin HEAD:fix/transcription-state-result-write-fence
