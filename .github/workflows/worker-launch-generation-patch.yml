name: Worker Launch Generation Patch

on:
  push:
    branches:
      - fix/worker-launch-reservation-generation

permissions:
  contents: write

jobs:
  patch-worker-launch-generation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/worker-launch-reservation-generation
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply and validate launch-generation patch
        shell: bash
        run: |
          python scripts/patch_worker_launch_generation.py
          python scripts/fix_worker_launch_guard_patch.py
          python -m py_compile services/processing_jobs.py services/worker_launch_guard.py scripts/run_processing_job.py tests/smoke_worker_launch_fencing.py
          python tests/smoke_worker_launch_fencing.py
          git rm scripts/patch_worker_launch_generation.py scripts/fix_worker_launch_guard_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/processing_jobs.py services/worker_launch_guard.py scripts/run_processing_job.py tests/smoke_worker_launch_fencing.py docs/worker-launch-fencing.md
          git commit -m 'fix: bind workers to launch reservation generation'
          git push origin HEAD:fix/worker-launch-reservation-generation
