{% extends "base.html" %}
{% block title %}フロー作成{% endblock %}

{% block content %}
<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-brand-900 mb-6">インタビューフローを作成</h1>
  <form method="POST" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 space-y-5">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">フロータイトル <span class="text-red-500">*</span></label>
      <input name="title" type="text" required placeholder="例：第1回インタビューフロー"
             class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">バージョン</label>
      <input name="version" type="text" value="1.0"
             class="w-32 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">メモ</label>
      <textarea name="notes" rows="2"
                class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></textarea>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit"
              class="bg-brand-500 text-white px-6 py-2 rounded hover:bg-brand-700 transition text-sm font-medium">
        作成してセクションを追加
      </button>
      <a href="{{ url_for('flows.index', project_id=project.id) }}"
         class="text-gray-500 px-4 py-2 text-sm hover:underline">キャンセル</a>
    </div>
  </form>
</div>
{% endblock %}
