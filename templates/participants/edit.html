{% extends "base.html" %}
{% block title %}参加者編集{% endblock %}

{% block content %}
<div class="max-w-2xl">
  <h1 class="text-2xl font-bold text-brand-900 mb-6">参加者を編集</h1>
  <form method="POST" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 space-y-5">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">参加者コード</label>
        <input name="participant_code" type="text" value="{{ participant.participant_code }}"
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">表示名</label>
        <input name="display_name" type="text" value="{{ participant.display_name or '' }}"
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">参加者属性</label>
      <div id="attrs" class="space-y-2">
        {% for a in participant.attributes %}
        <div class="flex gap-2">
          <input name="attr_key" type="text" value="{{ a.attribute_key }}"
                 class="w-1/3 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
          <input name="attr_value" type="text" value="{{ a.attribute_value or '' }}"
                 class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
          <button type="button" onclick="this.parentElement.remove()"
                  class="text-red-400 hover:text-red-600 px-2">×</button>
        </div>
        {% endfor %}
      </div>
      <button type="button" onclick="addAttr()"
              class="mt-2 text-sm text-brand-500 hover:underline">＋ 属性を追加</button>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit"
              class="bg-brand-500 text-white px-6 py-2 rounded hover:bg-brand-700 transition text-sm font-medium">
        保存する
      </button>
      <a href="{{ url_for('participants.index', project_id=project.id) }}"
         class="text-gray-500 px-4 py-2 text-sm hover:underline">キャンセル</a>
    </div>
  </form>
</div>
<script>
function addAttr(){
  const div = document.createElement('div');
  div.className = 'flex gap-2';
  div.innerHTML = `
    <input name="attr_key" type="text" placeholder="属性名"
           class="w-1/3 border border-gray-300 rounded px-3 py-2 text-sm">
    <input name="attr_value" type="text" placeholder="値"
           class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm">
    <button type="button" onclick="this.parentElement.remove()"
            class="text-red-400 px-2">×</button>
  `;
  document.getElementById('attrs').appendChild(div);
}
</script>
{% endblock %}
